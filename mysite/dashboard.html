<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker Dashboard</title>
<style>
  :root {
    --bg: #090A10;
    --panel: rgba(255,255,255,0.045);
    --panel-border: rgba(255,255,255,0.09);
    --text: #ECEDF2;
    --text-soft: #8B8E9C;
    --violet: #7C6CF0;
    --violet-soft: rgba(124,108,240,0.18);
    --amber: #F2A93B;
    --amber-soft: rgba(242,169,59,0.16);
    --error: #F0685C;
    --error-soft: rgba(240,104,92,0.15);
    --ok: #52C793;
    --ok-soft: rgba(82,199,147,0.15);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg: #EDEFF5;
    --panel: rgba(255,255,255,0.75);
    --panel-border: rgba(20,22,30,0.08);
    --text: #14161E;
    --text-soft: #6A6D7C;
  }
  * { box-sizing: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }
  .glow {
    position: fixed; inset: -20%; z-index: 0;
    background:
      radial-gradient(32% 26% at 15% 10%, rgba(124,108,240,0.22), transparent 60%),
      radial-gradient(26% 22% at 88% 6%, rgba(242,169,59,0.10), transparent 60%);
    filter: blur(50px);
    pointer-events: none;
  }

  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 26px 22px 60px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 26px; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; }
  .brand span { font-weight: 650; font-size: 1.02rem; }

  .top-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--text-soft); display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(10px);
  }
  .icon-btn svg { width: 17px; height: 17px; }

  h1.page-title { font-size: 1.5rem; margin: 0 0 4px; }
  p.page-sub { margin: 0 0 24px; color: var(--text-soft); font-size: 0.92rem; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px;
  }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat-card {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 16px 18px; backdrop-filter: blur(14px);
  }
  .stat-card .label { font-size: 0.8rem; color: var(--text-soft); margin-bottom: 6px; }
  .stat-card .value { font-size: 1.7rem; font-weight: 650; }
  .stat-card .delta { font-size: 0.78rem; margin-top: 4px; }
  .delta.up { color: var(--ok); }
  .delta.down { color: var(--error); }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 20px 22px; backdrop-filter: blur(14px);
    margin-bottom: 22px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .panel-head h2 { font-size: 1.05rem; margin: 0; }

  /* chart */
  .chart-row { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar {
    width: 100%; max-width: 34px; border-radius: 6px 6px 3px 3px;
    background: linear-gradient(180deg, var(--violet), rgba(124,108,240,0.35));
    transition: transform 0.2s ease;
  }
  .bar:hover { transform: scaleY(1.03); }
  .bar-col .day { font-size: 0.74rem; color: var(--text-soft); }

  /* controls */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .search {
    flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--panel-border);
    border-radius: 9px; padding: 8px 12px;
  }
  :root[data-theme="light"] .search { background: rgba(20,22,30,0.03); }
  .search svg { width: 15px; height: 15px; color: var(--text-soft); flex-shrink: 0; }
  .search input { border: none; background: none; outline: none; color: var(--text); font: inherit; width: 100%; }
  .search input::placeholder { color: var(--text-soft); }

  .chip {
    padding: 7px 13px; border-radius: 999px; font-size: 0.82rem;
    border: 1px solid var(--panel-border); background: transparent; color: var(--text-soft);
    cursor: pointer; transition: all 0.15s ease;
  }
  .chip.active { background: var(--violet); border-color: var(--violet); color: #fff; }

  .add-btn {
    padding: 9px 15px; border-radius: 9px; border: none; background: var(--violet);
    color: #fff; font: inherit; font-weight: 600; font-size: 0.86rem; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn svg { width: 15px; height: 15px; }

  /* add form */
  .add-form {
    display: none; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
    background: rgba(124,108,240,0.06); border: 1px dashed var(--panel-border);
    border-radius: 10px; padding: 14px;
  }
  .add-form.show { display: flex; }
  .add-form input, .add-form select {
    flex: 1; min-width: 130px; font: inherit; font-size: 0.88rem; color: var(--text);
    background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 8px 10px; outline: none;
  }
  .add-form button { padding: 8px 16px; border-radius: 8px; border: none; background: var(--violet); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }

  /* table */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 0.76rem; color: var(--text-soft); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--panel-border);
  }
  tbody td { padding: 12px 10px; border-bottom: 1px solid var(--panel-border); font-size: 0.9rem; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: rgba(124,108,240,0.05); }

  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 600;
  }
  .badge.progress { background: var(--amber-soft); color: var(--amber); }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .badge.overdue { background: var(--error-soft); color: var(--error); }
  .badge.todo { background: rgba(139,142,156,0.15); color: var(--text-soft); }

  select.status-select {
    font: inherit; font-size: 0.78rem; background: transparent; color: inherit;
    border: none; cursor: pointer; outline: none;
  }

  .row-owner { display: flex; align-items: center; gap: 8px; }
  .avatar-chip {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--violet), #9C8CFF);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 700; color: #fff;
  }

  .del-btn { background: none; border: none; color: var(--text-soft); cursor: pointer; padding: 4px; }
  .del-btn:hover { color: var(--error); }
  .del-btn svg { width: 15px; height: 15px; }

  .empty-state { text-align: center; padding: 30px 10px; color: var(--text-soft); font-size: 0.9rem; display: none; }
  .empty-state.show { display: block; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 26 26" fill="none">
        <rect x="1" y="1" width="24" height="24" rx="6" stroke="#7C6CF0" stroke-width="1.6"/>
        <path d="M7.5 17V9L13 12.5L18.5 9V17" stroke="#7C6CF0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Employee Portal</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <div class="avatar-chip" style="width:38px;height:38px;font-size:0.85rem;">JD</div>
    </div>
  </header>

  <h1 class="page-title">Tracker</h1>
  <p class="page-sub">Track tasks, status, and progress in one place.</p>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Total items</div>
      <div class="value" id="statTotal">0</div>
    </div>
    <div class="stat-card">
      <div class="label">In progress</div>
      <div class="value" id="statProgress">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Completed</div>
      <div class="value" id="statDone">0</div>
      <div class="delta up">▲ on track</div>
    </div>
    <div class="stat-card">
      <div class="label">Overdue</div>
      <div class="value" id="statOverdue">0</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>This week's completions</h2></div>
    <div class="chart-row" id="chartRow"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>All items</h2>
      <button class="add-btn" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add item
      </button>
    </div>

    <div class="add-form" id="addForm">
      <input type="text" id="newTitle" placeholder="Item name">
      <input type="text" id="newOwner" placeholder="Owner initials">
      <input type="date" id="newDue">
      <select id="newStatus">
        <option value="todo">To do</option>
        <option value="progress">In progress</option>
        <option value="done">Done</option>
      </select>
      <button id="saveNew">Save</button>
    </div>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search items…">
      </div>
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="todo">To do</button>
      <button class="chip" data-filter="progress">In progress</button>
      <button class="chip" data-filter="done">Done</button>
      <button class="chip" data-filter="overdue">Overdue</button>
    </div>

    <table>
      <thead>
        <tr><th>Item</th><th>Owner</th><th>Due</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState">No items match this view.</div>
  </div>

</div>

<script>
  let items = [
    { id: 1, title: 'Update onboarding checklist', owner: 'AR', due: '2026-09-28', status: 'progress' },
    { id: 2, title: 'Review Q3 timesheets', owner: 'JD', due: '2026-09-20', status: 'overdue' },
    { id: 3, title: 'Set up new hire badge', owner: 'MK', due: '2026-09-30', status: 'todo' },
    { id: 4, title: 'File expense report', owner: 'JD', due: '2026-09-18', status: 'done' },
    { id: 5, title: 'Schedule team retro', owner: 'AR', due: '2026-10-02', status: 'todo' },
    { id: 6, title: 'Approve leave requests', owner: 'MK', due: '2026-09-26', status: 'progress' },
    { id: 7, title: 'Renew equipment inventory', owner: 'JD', due: '2026-09-15', status: 'overdue' },
    { id: 8, title: 'Complete compliance training', owner: 'AR', due: '2026-09-22', status: 'done' }
  ];
  let nextId = 9;
  let currentFilter = 'all';
  let searchTerm = '';

  const today = new Date('2026-09-25');

  function isOverdue(item) {
    return item.status !== 'done' && new Date(item.due) < today;
  }
  function effectiveStatus(item) {
    return isOverdue(item) ? 'overdue' : item.status;
  }

  const badgeLabel = { todo: 'To do', progress: 'In progress', done: 'Done', overdue: 'Overdue' };

  function render() {
    const tbody = document.getElementById('tableBody');
    const empty = document.getElementById('emptyState');
    tbody.innerHTML = '';

    const filtered = items.filter(it => {
      const st = effectiveStatus(it);
      const matchesFilter = currentFilter === 'all' || st === currentFilter;
      const matchesSearch = it.title.toLowerCase().includes(searchTerm.toLowerCase());
      return matchesFilter && matchesSearch;
    });

    empty.classList.toggle('show', filtered.length === 0);

    filtered.forEach(it => {
      const st = effectiveStatus(it);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${it.title}</td>
        <td><div class="row-owner"><div class="avatar-chip">${it.owner}</div>${it.owner}</div></td>
        <td>${new Date(it.due).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</td>
        <td>
          <select class="status-select" data-id="${it.id}">
            <option value="todo" ${it.status==='todo'?'selected':''}>To do</option>
            <option value="progress" ${it.status==='progress'?'selected':''}>In progress</option>
            <option value="done" ${it.status==='done'?'selected':''}>Done</option>
          </select>
          <span class="badge ${st}" style="margin-left:6px;">${badgeLabel[st]}</span>
        </td>
        <td>
          <button class="del-btn" data-id="${it.id}" aria-label="Delete item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          </button>
        </td>`;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', (e) => {
        const id = Number(e.target.dataset.id);
        items = items.map(it => it.id === id ? { ...it, status: e.target.value } : it);
        render();
      });
    });
    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.dataset.id);
        items = items.filter(it => it.id !== id);
        render();
      });
    });

    document.getElementById('statTotal').textContent = items.length;
    document.getElementById('statProgress').textContent = items.filter(it => it.status === 'progress').length;
    document.getElementById('statDone').textContent = items.filter(it => it.status === 'done').length;
    document.getElementById('statOverdue').textContent = items.filter(isOverdue).length;
  }

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      render();
    });
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    render();
  });

  document.getElementById('addBtn').addEventListener('click', () => {
    document.getElementById('addForm').classList.toggle('show');
  });

  document.getElementById('saveNew').addEventListener('click', () => {
    const title = document.getElementById('newTitle').value.trim();
    const owner = document.getElementById('newOwner').value.trim().toUpperCase() || '—';
    const due = document.getElementById('newDue').value || '2026-10-01';
    const status = document.getElementById('newStatus').value;
    if (!title) return;
    items.push({ id: nextId++, title, owner, due, status });
    document.getElementById('newTitle').value = '';
    document.getElementById('newOwner').value = '';
    document.getElementById('newDue').value = '';
    document.getElementById('addForm').classList.remove('show');
    render();
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    const root = document.documentElement;
    root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  // simple weekly chart
  const weekData = [3, 5, 2, 6, 4, 1, 3];
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const chartRow = document.getElementById('chartRow');
  const max = Math.max(...weekData);
  weekData.forEach((v, i) => {
    const col = document.createElement('div');
    col.className = 'bar-col';
    col.innerHTML = `<div class="bar" style="height:${(v/max*100)}px;" title="${v} completed"></div><div class="day">${days[i]}</div>`;
    chartRow.appendChild(col);
  });

  render();
</script>
</body>
</html>
